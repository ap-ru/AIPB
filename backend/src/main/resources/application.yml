server:
  port: 8080

spring:
  application:
    name: aipb-backend
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/aipb}
      auto-index-creation: true
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info

aipb:
  seed:
    enabled: ${AIPB_SEED:true}
    reset-on-start: ${AIPB_RESET:false}
  graph:
    # Source data (the bank graph in Neo4j), always pinned to this database and read-only. Pages read it with the
    # driver (uri); the assistant explores it through the Cypher MCP server (mcp-url).
    uri: ${AIPB_GRAPH_URI:bolt://localhost:7687}
    user: ${AIPB_GRAPH_USER:neo4j}
    password: ${AIPB_GRAPH_PASSWORD:}
    database: ${AIPB_GRAPH_DB:neo4j}
    # caps on every query, from either reader
    max-records: 1000
    max-time-ms: 10000
    mcp-url: ${AIPB_MCP_URL:http://localhost:3001/mcp/}
    mcp-timeout-seconds: ${AIPB_MCP_TIMEOUT:20}
  assistant:
    # The widget assistant (com.aipb.assistant). Disabled when no API key is set.
    api-key: ${ANTHROPIC_API_KEY:}
    base-url: ${ANTHROPIC_BASE_URL:https://api.anthropic.com}
    # model per stage: Haiku for the light stages, Sonnet for the reasoning-heavy ones
    model:
      intake: ${AIPB_MODEL_INTAKE:claude-haiku-5-5}
      build: ${AIPB_MODEL_BUILD:claude-sonnet-5-5}
      review: ${AIPB_MODEL_REVIEW:claude-sonnet-5-5}
      present: ${AIPB_MODEL_PRESENT:claude-haiku-5-5}
      narrate: ${AIPB_MODEL_NARRATE:claude-haiku-5-5}
    # low | medium | high | xhigh | max per stage; thinking is always on, so effort sets depth, latency and cost
    effort:
      intake: ${AIPB_EFFORT_INTAKE:medium}
      build: ${AIPB_EFFORT_BUILD:medium}
      review: ${AIPB_EFFORT_REVIEW:medium}
      present: ${AIPB_EFFORT_PRESENT:medium}
      narrate: ${AIPB_EFFORT_NARRATE:medium}
    max-tokens:
      intake: 8000
      build: 32000
      review: 32000
      present: 8000
      narrate: 8000
    # caps that bound every run
    max-tool-calls: 16
    max-submits: 4
    max-present-attempts: 3
    run-timeout-seconds: 360
    # USD per million tokens by model, for the per-session cost estimate (Haiku rates are for prompts up to 100K tokens)
    price:
      "[claude-haiku-5-5]": { input: 0.10, output: 0.50, cache-read: 0.01, cache-write: 0.125 }
      "[claude-sonnet-5-5]": { input: 2.0, output: 10.0, cache-read: 0.2, cache-write: 2.5 }
      "[claude-opus-5-5]": { input: 4.0, output: 20.0, cache-read: 0.2, cache-write: 5.0 }
  cors:
    allowed-origins: ${AIPB_CORS:http://localhost:3000,http://localhost:5173}

logging:
  level:
    com.aipb: INFO
